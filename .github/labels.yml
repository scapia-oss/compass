# Labels for the Compass repository.
# Apply with: gh label create <name> --color <color> --description "<desc>" --force
# Or use the bootstrap script: .github/scripts/sync-labels.sh

# --- Type ---
- name: bug
  color: "d73a4a"
  description: "Something isn't working"
- name: enhancement
  color: "a2eeef"
  description: "New feature or improvement"
- name: documentation
  color: "0075ca"
  description: "Documentation only change"
- name: question
  color: "d876e3"
  description: "Question about usage or workflow"

# --- Status ---
- name: triage
  color: "fbca04"
  description: "Needs maintainer triage"
- name: confirmed
  color: "0e8a16"
  description: "Triaged and confirmed"
- name: wontfix
  color: "ffffff"
  description: "Will not be addressed"
- name: duplicate
  color: "cfd3d7"
  description: "Duplicate of another issue"

# --- Priority ---
- name: "priority: critical"
  color: "b60205"
  description: "Blocks users, needs immediate fix"
- name: "priority: high"
  color: "d93f0b"
  description: "Important, fix soon"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have, no rush"

# --- Area ---
- name: "area: skills"
  color: "bfd4f2"
  description: "Skill templates (spec-*, impl, review, debug, etc.)"
- name: "area: builder"
  color: "bfd4f2"
  description: "Build pipeline (build-plugin.mjs, tests)"
- name: "area: rules"
  color: "bfd4f2"
  description: "Shared rules and settings"
- name: "area: hooks"
  color: "bfd4f2"
  description: "Plugin hooks (git-guard, session-init, feedback-capture)"
- name: "area: docs"
  color: "bfd4f2"
  description: "Documentation site or README"
- name: "area: ci"
  color: "bfd4f2"
  description: "CI/CD workflows"

# --- PR labels ---
- name: "breaking"
  color: "e11d48"
  description: "Introduces a breaking change"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
